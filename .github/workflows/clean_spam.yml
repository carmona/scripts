name: Clean Outlook Spam (No-TLD)

on:
  schedule:
    # every 4 hours
    - cron: '0 */4 * * *'
  # Allows triggering the workflow manually from the Actions tab in GitHub
  workflow_dispatch:

jobs:
  clean-spam:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run spam cleaner
        env:
          OUTLOOK_CLIENT_ID: ${{ secrets.OUTLOOK_CLIENT_ID }}
          OUTLOOK_REFRESH_TOKEN: ${{ secrets.OUTLOOK_REFRESH_TOKEN }}
        run: |
          python clean_spam.py
